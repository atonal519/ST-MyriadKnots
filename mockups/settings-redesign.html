<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千千结 · 设置页重构效果图</title>
<style>
/* ============ 复用 panel.css 的真实设计 token ============ */
.qqj-shell{
  --paper:#e8ecec;--panel:#f6f8f8;--ink:#22282b;--soft:#5c6a70;--faint:#93a1a5;
  --line:#d0d9db;--thread:#c1ccce;--crimson:#a8322f;--knot:#a8322f;--blue:#4f8781;--success:#4b7d63;
  color:var(--ink);
  font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
.qqj-shell[data-qqj-theme="night"]{
  --paper:#13181b;--panel:#1c2327;--ink:#e7ecee;--soft:#9db0b5;--faint:#6c7c81;
  --line:#2b363b;--thread:#33424a;--crimson:#d9707a;--knot:#d9707a;--blue:#77b0aa;--success:#77b193;
}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit}

/* ============ 页面演示外壳（非面板本身） ============ */
body{margin:0;min-height:100vh;display:grid;place-items:start center;gap:18px;padding:28px 16px 60px;
  background:#c9d2d3;font:13px/1.5 -apple-system,"Microsoft YaHei",sans-serif}
body.demo-night{background:#0c1013}
.demo-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.demo-bar button{padding:7px 14px;border:1px solid #9aa8ab;border-radius:8px;background:#fff;color:#22282b;cursor:pointer;font-size:12px}
.demo-bar button.on{background:#22282b;color:#fff;border-color:#22282b}
.demo-note{color:#5c6a70;font-size:11px}
body.demo-night .demo-note{color:#93a1a5}

/* ============ 面板外壳（对齐真实 shell/panel.css） ============ */
.panel{width:360px;max-width:calc(100vw - 32px);height:600px;max-height:calc(100vh - 120px);
  display:grid;grid-template-rows:auto auto minmax(0,1fr);
  overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--paper);
  box-shadow:0 16px 54px rgba(18,28,33,.24)}
.topbar{display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:8px}
.mark{font:700 18px/1 宋体,"Songti SC",serif;letter-spacing:.12em}
.mark .em{color:var(--crimson)}
.sub{color:var(--faint);font-size:8px;letter-spacing:.16em}
.icon-btn{display:grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--soft);cursor:pointer}
.icon-btn.settings-btn{margin-left:auto}
.icon-btn:hover{color:var(--crimson);background:rgba(169,56,72,.07)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{position:relative;padding:10px 13px;border:0;background:transparent;color:var(--soft);white-space:nowrap;cursor:pointer}
.tab.active{color:var(--ink);font-weight:700}
.body{min-height:0;overflow-y:auto;scrollbar-gutter:stable;padding:0 14px 18px}
.status-line{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:7px;padding:10px 0 8px;background:linear-gradient(var(--paper) 82%,transparent)}
.status-dot{width:6px;height:6px;border-radius:1.5px;transform:rotate(45deg);background:var(--success)}
.status-label{color:var(--soft);font-size:10px;letter-spacing:.04em}

/* ============ 新设置页 · 统一类型阶梯 ============ */
.settings-page{display:grid;gap:10px}
.settings-page>h2{margin:0 2px 2px;font:700 20px/1.2 宋体,"Songti SC",serif;letter-spacing:.04em}

/* —— 字号阶梯（全设置页共用）——
   页标题 20 / 组标题 14 / 子抽屉 12.5 / 字段标签 11 / 正文·输入 13 / 提示 10.5 / 按钮 12 */

/* —— 总开关：主控级，左描红细线，轻卡片 —— */
.master-switch{display:grid;gap:8px;padding:12px 13px;border:1px solid var(--line);border-left:3px solid var(--crimson);border-radius:10px;background:var(--panel)}
.master-switch .setting-switch{font:600 13px/1.4 -apple-system,"Microsoft YaHei",sans-serif}

/* —— 顶层分组抽屉（通用设置 / 记忆设置）—— */
.group{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.group>summary{display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer;list-style:none}
.group>summary::-webkit-details-marker{display:none}
.group>summary::before{content:"›";flex:0 0 auto;color:var(--soft);font-size:17px;line-height:1;transition:transform .15s ease}
.group[open]>summary::before{transform:rotate(90deg)}
.group>summary h3{margin:0;font:700 14px 宋体,"Songti SC",serif;letter-spacing:.02em}
.group>summary .group-hint{margin-left:auto;color:var(--faint);font-size:10px;font-weight:400}
.group-body{display:grid;gap:2px;padding:0 12px 8px}

/* —— 子抽屉（API配置 / 世界书排除 / 提示词 / 外观 / 记忆提取周期）—— */
.sub{border-top:1px solid var(--line)}
.sub>summary{display:flex;align-items:center;gap:7px;padding:10px 2px;cursor:pointer;list-style:none}
.sub>summary::-webkit-details-marker{display:none}
.sub>summary::before{content:"›";flex:0 0 auto;color:var(--faint);font-size:14px;line-height:1;transition:transform .15s ease}
.sub[open]>summary::before{transform:rotate(90deg)}
.sub>summary h4{margin:0;font:700 12.5px 宋体,"Songti SC",serif;color:var(--ink)}
.sub>summary .sub-tag{margin-left:auto;color:var(--faint);font-size:9.5px;font-weight:400}
.sub-body{display:grid;gap:9px;padding:2px 2px 12px}

/* —— 字段 —— */
.field{display:grid;gap:5px}
.field>span{font-weight:600;font-size:11px;letter-spacing:.02em;color:var(--soft)}
.input{width:100%;min-width:0;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--knot);box-shadow:0 0 0 2px color-mix(in srgb,var(--knot) 18%,transparent)}
textarea.input{min-height:60px;line-height:1.5;resize:vertical}
/* 去掉 number 上下箭头，纯手填 */
.input[type=number]{-moz-appearance:textfield}
.input[type=number]::-webkit-outer-spin-button,
.input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hint{margin:0;color:var(--faint);font-size:10.5px;line-height:1.55}
.setting-switch{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);cursor:pointer}
.setting-switch input{width:15px;height:15px;flex:0 0 auto;accent-color:var(--knot)}

/* —— 字段行：模型 + 拉取模型（等高对齐）—— */
.field-inline{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:stretch}
.field-inline .btn{align-self:stretch;display:grid;place-items:center}

/* —— 分割线 —— */
.divider{height:1px;margin:3px 0;background:var(--line)}
.divider.labeled{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;height:auto;background:none}
.divider.labeled::before,.divider.labeled::after{content:"";height:1px;background:var(--line)}
.divider.labeled span{color:var(--faint);font-size:9.5px;letter-spacing:.08em;font-weight:700}

/* —— 按钮 —— */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.btn{padding:7px 12px;border-radius:7px;cursor:pointer;font-size:12px;line-height:1.2;white-space:nowrap}
.btn.primary{border:1px solid var(--crimson);background:var(--crimson);color:#fff}
.btn.secondary{border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.tiny{padding:8px 10px;font-size:11px}

/* —— 高级设置（第三层，虚线分隔，与内容左对齐）—— */
.sub.sub-advanced{border-top:1px dashed var(--line);margin-top:2px}
.sub.sub-advanced>summary h4{color:var(--soft)}

/* —— 记忆提取周期：独立字段，输入框收窄 —— */
.field .num{width:64px;text-align:center}
.result{margin:2px 0 0;color:var(--success);font-size:10.5px}

/* —— 缩放滑块 —— */
.scale-row{display:flex;align-items:center;gap:10px}
.scale-row input[type=range]{flex:1;accent-color:var(--knot)}
.scale-row output{min-width:3em;text-align:right;color:var(--soft);font-size:11px}
</style>
</head>
<body>

<div class="demo-bar qqj-shell">
  <button id="btn-day" class="on" type="button">☀ 日间</button>
  <button id="btn-night" type="button">☾ 夜间</button>
  <span class="demo-note">← 切主题预览（真实面板里主题=设置项，选中即变）｜抽屉可点击展开</span>
</div>

<div class="panel qqj-shell" data-qqj-theme="day" id="panel">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand"><span class="mark">千<span class="em">千</span>结</span><span class="sub">QIANQIANJIE</span></div>
    <button class="icon-btn settings-btn" type="button" title="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.1 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.3V9.6h.1A1.7 1.7 0 0 0 4.1 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.56 3.7l.06.06A1.7 1.7 0 0 0 8.5 4.1a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2.3h4v.1A1.7 1.7 0 0 0 15 4.1a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 8.5a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1v4h-.1A1.7 1.7 0 0 0 19.4 15Z"></path></svg>
    </button>
    <button class="icon-btn" type="button" title="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
  </header>

  <!-- 标签页 -->
  <nav class="tabs">
    <button class="tab" type="button">千人</button>
    <button class="tab" type="button">千结</button>
    <button class="tab" type="button">双丝网</button>
    <button class="tab" type="button">下一步</button>
  </nav>

  <!-- 设置页正文 -->
  <main class="body">
    <div class="status-line"><span class="status-dot"></span><span class="status-label">千千结设置 · 改动即时保存</span></div>

    <section class="settings-page">
      <h2>千千结设置</h2>

      <!-- ========== 总开关（standalone 主控） ========== -->
      <div class="master-switch">
        <label class="setting-switch"><input type="checkbox" checked> 启用千千结</label>
      </div>

      <!-- ========== 通用设置 ========== -->
      <details class="group">
        <summary><h3>通用设置</h3></summary>
        <div class="group-body">

          <!-- ① API 配置 -->
          <details class="sub">
            <summary><h4>API 配置</h4></summary>
            <div class="sub-body">
              <label class="field"><span>分析API（建议高质模型）</span>
                <select class="input"><option>主配置</option><option>Gemini 高质预设</option></select></label>
              <label class="field"><span>摘要API（建议快速模型）</span>
                <select class="input"><option>跟随分析API</option><option>Flash 快速预设</option></select></label>

              <div class="divider"></div>

              <label class="field"><span>URL</span><input class="input" value="https://suzhi.bond:28443/v1"></label>
              <label class="field"><span>Key</span><input class="input" type="password" placeholder="已保存，留空保持不变"></label>
              <div class="field">
                <span>模型</span>
                <div class="field-inline">
                  <input class="input" value="gemini-3.5-flash">
                  <button class="btn secondary" type="button">拉取模型</button>
                </div>
              </div>

              <div class="actions">
                <button class="btn primary" type="button">保存设置</button>
                <button class="btn secondary" type="button">另存为预设</button>
                <button class="btn secondary" type="button">测试连接</button>
              </div>
              <p class="result">连接成功 · gemini-3.5-flash</p>

              <!-- 高级设置（第三层） -->
              <details class="sub sub-advanced">
                <summary><h4>高级设置</h4></summary>
                <div class="sub-body">
                  <label class="field"><span>排除参数（每行一个）</span><textarea class="input" placeholder="例如 temperature"></textarea></label>
                  <label class="setting-switch"><input type="checkbox"> 流式请求</label>
                  <label class="field"><span>超时秒数</span><input class="input" type="number" value="180"></label>
                </div>
              </details>
            </div>
          </details>

          <!-- ② 世界书排除 -->
          <details class="sub">
            <summary><h4>世界书排除</h4><span class="sub-tag">已排除 1 / 共 3 本</span></summary>
            <div class="sub-body">
              <input class="input" type="search" placeholder="搜索世界书">
              <label class="setting-switch"><input type="checkbox" checked> 恶女之路予花予剑</label>
              <label class="setting-switch"><input type="checkbox"> Burning Chrome</label>
              <label class="setting-switch"><input type="checkbox"> Eldoria</label>
            </div>
          </details>

          <!-- ③ 提示词与包裹符 -->
          <details class="sub">
            <summary><h4>提示词与包裹符</h4></summary>
            <div class="sub-body">
              <label class="field"><span>保留正文的包裹符</span><input class="input" value="content"></label>
              <label class="field"><span>连同内容剔除的包裹符</span><input class="input" placeholder="示例：think, reasoning, [[...]]"></label>
              <label class="field"><span>通用附加提示词</span><textarea class="input" placeholder="留空则不追加通用提示词"></textarea></label>
            </div>
          </details>

          <!-- ④ 外观 -->
          <details class="sub">
            <summary><h4>外观</h4></summary>
            <div class="sub-body">
              <label class="field"><span>主题</span>
                <select class="input"><option>自动</option><option>日间</option><option>夜间</option></select></label>
              <div class="field"><span>界面缩放</span>
                <div class="scale-row"><input type="range" min="0.75" max="1.5" step="0.05" value="1"><output>100%</output></div>
              </div>
              <label class="field"><span>自定义字体 CSS URL</span><input class="input" placeholder="https://…/font.css"></label>
            </div>
          </details>

        </div>
      </details>

      <!-- ========== 记忆设置 ========== -->
      <details class="group">
        <summary><h3>记忆设置</h3></summary>
        <div class="group-body">
          <details class="sub">
            <summary><h4>记忆提取周期</h4></summary>
            <div class="sub-body">
              <label class="field"><span>每 N 楼提取一次记忆</span>
                <input class="input num" type="number" min="1" max="20" value="2"></label>
            </div>
          </details>
        </div>
      </details>

    </section>
  </main>
</div>

<script>
  const panel = document.getElementById('panel');
  const bar = [document.getElementById('btn-day'), document.getElementById('btn-night')];
  const setTheme = t => {
    panel.dataset.qqjTheme = t;
    document.body.classList.toggle('demo-night', t === 'night');
    bar.forEach(b => b.classList.toggle('on', b.id === 'btn-' + t));
  };
  bar[0].onclick = () => setTheme('day');
  bar[1].onclick = () => setTheme('night');
  // 缩放滑块实时百分比
  const range = panel.querySelector('input[type=range]');
  const out = panel.querySelector('output');
  range.addEventListener('input', () => out.textContent = Math.round(range.value * 100) + '%');
</script>
</body>
</html>
