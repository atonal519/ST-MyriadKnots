<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>通用底图预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#22282b;font:14px/1.5 system-ui}body[data-theme=night]{background:#13181b;color:#e7ecee;color-scheme:dark}main{max-width:780px;margin:auto;padding:14px}header,.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}h1{font-size:18px;margin:0 12px 0 0}button,select{font:inherit;color:inherit;background:transparent;border:1px solid #879f9c;border-radius:6px;padding:5px 9px;min-height:34px;cursor:pointer}button[aria-pressed=true]{border-color:currentColor;font-weight:600}#map-host{display:block;width:100%}.note{font-size:12px;line-height:1.6;margin:10px 0;color:inherit;opacity:.75}</style>
<main><header><h1>通用底图</h1><button id="theme" type="button">夜间</button></header><nav class="controls" id="maps" aria-label="底图"></nav><div class="controls"><label>分区数量 <select id="count" aria-label="分区数量"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select></label></div><div id="map-host"></div><p class="note" id="selection">点选地区或场地查看选中反馈。</p><p class="note">静态示意；示例地区、点位只用于检查显示。正式界面仍读取聊天的现有底图保存值。</p></main>
<script type="module">
import{QIANCHUANG_BASEMAPS}from'../src/ui/qianchuang-basemaps.js';
import{qianchuangMapLayout}from'../src/ui/qianchuang-map-layout.js';
import{resolveAppearance}from'../src/ui/appearance.js';
const keys=['modern-town','old-town','sci-fi'],host=document.getElementById('map-host'),root=host.attachShadow({mode:'open'}),note=document.getElementById('selection');let active=keys[0],theme='day';
const link=document.createElement('link');link.rel='stylesheet';link.href=new URL('../src/ui/panel.css',import.meta.url).href;root.append(link);const style=document.createElement('style');style.textContent=':host{--qqj-font-caption:12px;--qqj-font-subheading:16px;--qqj-radius-option:6px;--qqj-radius-card:10px;--qqj-color-on-accent:var(--on-primary,#fff);display:block}.qqj-window-map{margin:0}.qqj-window-area-open{font-size:min(16px,var(--qqj-window-area-font))}';root.append(style);const target=document.createElement('div');root.append(target);
const el=(tag,cls='')=>{const n=document.createElement(tag);n.className=cls;return n;};
for(const key of keys){const button=document.createElement('button');button.type='button';button.dataset.map=key;button.textContent=QIANCHUANG_BASEMAPS[key].label;button.onclick=()=>{active=key;render();};document.getElementById('maps').append(button);}
function render(){for(const button of document.querySelectorAll('[data-map]'))button.setAttribute('aria-pressed',String(button.dataset.map===active));const asset=QIANCHUANG_BASEMAPS[active],map=el('div','qqj-window-map');map.dataset.basemap=active;map.style.setProperty('--qqj-window-map-aspect','1000 / 1000');const geometry=el('div','qqj-window-geometry');geometry.innerHTML=`<svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${asset.markup}</svg>`;const regions=el('div','qqj-window-regions'),areas=el('div','qqj-window-areas'),points=el('div','qqj-window-points'),n=Number(document.getElementById('count').value),groups=Array.from({length:n},(_,i)=>({entityId:'area-'+i,siteIds:Array.from({length:i<3?3:1},(_,j)=>`${i+1}-${j+1}`)}));groups.push({entityId:null,siteIds:['独立一','独立二']});const layout=qianchuangMapLayout(active,groups);regions.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${layout.filter(r=>r.contour).map(r=>`<path class="qqj-window-region-outline" fill-rule="evenodd" d="${r.contours.map(c=>'M'+c.map(p=>p.join(',')).join('L')+'Z').join('')}"/>`).join('')}</svg>`;for(const region of layout){if(region.labelBox){const b=region.labelBox,label=el('button','qqj-window-area-open');label.type='button';label.textContent='区域'+(Number(region.entityId.split('-')[1])+1);Object.assign(label.style,{left:b.x+'%',top:b.y+'%',width:b.w+'%',height:b.h+'%'});label.style.setProperty('--qqj-window-area-font','4cqw');label.onclick=()=>{for(const a of areas.children)a.setAttribute('aria-pressed',String(a===label));note.textContent=label.textContent+' · 地图位置保持';};areas.append(label);}for(const p of region.points){const marker=el('button','qqj-window-marker');marker.type='button';marker.dataset.placeId=p.id;marker.setAttribute('aria-label','场地 '+p.id);marker.setAttribute('aria-pressed','false');marker.dataset.labelAlign=p.x<30?'start':p.x>70?'end':'center';marker.dataset.labelAbove=String(p.y>70);Object.assign(marker.style,{left:p.x+'%',top:p.y+'%'});const dot=el('span','qqj-window-dot'),label=el('span','qqj-window-marker-label');label.textContent='场地 '+p.id;marker.append(dot,label);marker.onclick=()=>{for(const m of points.children)m.setAttribute('aria-pressed',String(m===marker));note.textContent='已选场地 '+p.id;};points.append(marker);}}map.append(geometry,regions,areas,points);map.addEventListener('click',event=>{if(!event.target.closest('button')){for(const m of points.children)m.setAttribute('aria-pressed','false');note.textContent='点选地区或场地查看选中反馈。';}});target.replaceChildren(map);window.__genericPreview={key:active,layout,root,map};}
document.getElementById('count').onchange=render;document.getElementById('theme').onclick=()=>{theme=theme==='day'?'night':'day';document.body.dataset.theme=theme;host.dataset.qqjTheme=theme;host.style.setProperty('--on-primary',resolveAppearance({value:{appearanceTheme:theme}}).palette.onPrimary);document.getElementById('theme').textContent=theme==='day'?'夜间':'日间';};host.dataset.qqjTheme=theme;render();window.__ready=true;
</script>
</html>
